<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能医疗问诊预约系统</title><style>body{font-family:system-ui,sans-serif;max-width:30rem;margin:3rem auto;padding:0 1rem}label{display:block;margin:.7rem 0}input,select,button{font:inherit;padding:.5rem;width:100%;box-sizing:border-box}button{cursor:pointer}.captcha{display:flex;gap:.5rem}.captcha img{height:48px;border:1px solid #ddd}.error{color:#b91c1c}.ok{color:#166534}</style></head>
<body><div id="app"><h1>登录</h1><p v-if="message" :class="{error: failed,ok: !failed}">{{ message }}</p><form @submit.prevent="submit"><label>账号<input v-model="identifier" autocomplete="username" required></label><label>密码<input v-model="password" type="password" autocomplete="current-password" required></label><div class="captcha"><input v-model="captcha" placeholder="图形验证码" required><img v-if="image" :src="image" alt="图形验证码"><button type="button" @click="newCaptcha">刷新</button></div><button>登录</button></form></div><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script>const {createApp}=Vue;createApp({data:()=>({identifier:'',password:'',captcha:'',challengeId:'',image:'',message:'',failed:false,browserId:localStorage.getItem('browserId')||crypto.randomUUID()}),mounted(){localStorage.setItem('browserId',this.browserId);this.newCaptcha()},methods:{async newCaptcha(){const r=await fetch('/api/v1/auth/captcha',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({browserId:this.browserId})});const d=await r.json();if(r.ok){this.challengeId=d.challengeId;this.image=d.image;this.captcha='';this.message=''}else{this.failed=true;this.message=d.error?.message||'验证码暂不可用'}},async submit(){const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({identifier:this.identifier,password:this.password,captcha:this.captcha,challengeId:this.challengeId,browserId:this.browserId})});const d=await r.json();this.failed=!r.ok;this.message=r.ok?'登录成功':(d.error?.message||'登录失败');if(r.ok){sessionStorage.setItem('accessToken',d.accessToken);sessionStorage.setItem('refreshToken',d.refreshToken)}}}}).mount('#app');</script></body></html>
